name: PR Checks

env:
  FLUTTER_VERSION: '3.44.9'

on:
  pull_request:
    branches: [main]
  # Pushed straight to main, this repository never opened a pull request,
  # so analyze/test/format never ran at all. Same workflow, second trigger:
  # a separate file would duplicate the toolchain setup and drift from it.
  push:
    branches: [main]

jobs:
  checks:
    name: Analyze / Test / L10n / Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart format (changed files only)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          # Kept apart from the filter below on purpose: `|| true` on the filtered
          # form turned a failed diff -- a base that a force-push left unreachable,
          # for instance -- into "no changed Dart files", which is a silent pass.
          changed="$(git diff --diff-filter=ACMR --name-only "$BASE_SHA" "$HEAD_SHA" --)"
          files="$(printf '%s\n' "$changed" | grep -E '^(lib|test|integration_test)/.*\.dart$' || true)"
          if [ -z "$files" ]; then
            echo "No changed Dart files to format-check."
            exit 0
          fi

          echo "Format-checking files:"
          echo "$files"
          dart format --output=none --set-exit-if-changed $files

      - name: Stage the files the formatter would rewrite
        # Not conditional on the check above failing. That check only looks at
        # the files this push changed, so a file nobody has touched since the
        # gate was added is never looked at -- which is how three files stayed
        # unformatted through four pushes, and why this report covers the whole
        # repository instead.
        #
        # A report, not a second assertion: nothing here fails the job, and on a
        # clean tree the staged copy is dropped, so a green run hands over
        # nothing that could be mistaken for something to commit.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          staged=dart-format-recovery
          rm -rf "$staged"

          dart_files="$(git ls-files -- lib test integration_test | grep -E '\.dart$' || true)"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            mkdir -p "$staged/$(dirname "$f")"
            cp "$f" "$staged/$f"
          done <<< "$dart_files"

          # --parents is not used above: the loop builds the repository's own
          # directory layout, so the artifact can be copied straight back in.
          dart format "$staged"

          kept=0
          while IFS= read -r f; do
            rel="${f#"$staged"/}"
            if cmp -s "$f" "$rel"; then rm -f "$f"; else kept=$((kept + 1)); fi
          done < <(find "$staged" -name '*.dart' -type f)

          if [ "$kept" -eq 0 ]; then
            rm -rf "$staged"
            echo 'Every tracked Dart file is already formatted; nothing to hand over.'
          else
            echo "Handing over $kept file(s) the formatter would rewrite."
          fi

      - name: Upload the files the formatter would rewrite
        # `always()` for the same reason the staging is: the formatter's output is
        # the only thing here that cannot be produced off the runner. When the
        # staging found nothing it removed the directory, so this stays quiet on
        # a clean tree instead of leaving a stale artifact to be mistaken for
        # current output.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-format-recovery
          path: dart-format-recovery
          if-no-files-found: ignore
      - name: Generate l10n and ensure committed outputs
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: Upload the stale l10n output
        # This proot has no Flutter, so when the check above fails the
        # regenerated files have to come off the runner to be committed.
        # failure() only: a passing run has nothing to hand over, and an
        # always-on upload would leave a stale artifact behind.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lib-l10n-regenerated
          path: lib/l10n

      - name: No new untranslated messages (PR)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          BASE_DIR="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true
            rm -rf "$BASE_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          pushd "$BASE_DIR" >/dev/null
          flutter pub get
          flutter gen-l10n
          popd >/dev/null

          python3 .github/scripts/check_no_new_untranslated.py \
            "$BASE_DIR/desiredFileName.txt" \
            "desiredFileName.txt"

      - name: Create the gitignored local secrets file
        # lib/secrets/ is gitignored, so a fresh checkout cannot compile until
        # the committed stub is copied into place -- the same command a
        # developer runs after cloning.
        run: tool/setup_local_secrets.sh

      - name: dart analyze (root package only)
        run: dart analyze --fatal-infos lib test integration_test

      - name: flutter test
        run: flutter test

      - name: Probe the Android unit-test invocation
        # android/.gitignore excludes gradlew, gradlew.bat and gradle-wrapper.jar
        # (lines 1, 4 and 5), and this job has never had a JDK step, so how a
        # Kotlin unit test would run here is a question for the runner rather than
        # for this file. These lines answer it before anything is trusted to them.
        #
        # continue-on-error on purpose: this is a probe, and a probe that fails a
        # green gate proves nothing while hiding its own answer. It becomes a real
        # gate in the commit that knows the mechanism -- which is what this run is
        # for.
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          echo '--- java ---'
          java -version 2>&1 | head -3 || true
          echo '--- wrapper before ---'
          ls -l android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar 2>&1 || true
          echo '--- config-only ---'
          flutter build apk --config-only 2>&1 | tail -5 || true
          echo '--- wrapper after ---'
          ls -l android/gradlew android/gradle/wrapper/gradle-wrapper.jar 2>&1 || true
          echo '--- unit tests ---'
          if [ -x android/gradlew ]; then
            (cd android && ./gradlew :app:testDebugUnitTest --no-daemon 2>&1 | tail -40)
            # `tail -40` can cut the assertion messages off, and those are what say
            # why a run is red. They are read back from the report the task leaves
            # behind. Both roots are tried: the Flutter plugin re-roots the build
            # directory at the repository, the plain Android layout does not.
            for report in build/app/test-results/testDebugUnitTest/*.xml \
                          android/app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$report" ] || continue
              grep -h -m1 -A3 '<failure' "$report" | sed 's/^/    /' || true
            done
          else
            echo 'no wrapper appeared: the invocation is still unknown'
          fi
